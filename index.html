<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#05070d" />
  <title>Cashy Invaders</title>
  <meta name="description" content="Cashy throws cash at the rival coins. How many waves can you clear?" />
  <link rel="icon" href="assets/cashy.webp" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="wrap">
    <div id="stage">
      <canvas id="game" width="706" height="720" aria-label="Cashy Invaders, a game where Cashy throws cash at rival coins" role="img"></canvas>
      <button id="mute" type="button" aria-label="Sound on" aria-pressed="false" title="Sound (M)">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor" />
          <g id="mute-waves" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M16 9c1.3 1.6 1.3 4.4 0 6" />
            <path d="M18.5 6.5c2.6 3.2 2.6 7.8 0 11" />
          </g>
          <path id="mute-cross" d="M16 9l5 6M21 9l-5 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        </svg>
      </button>
    </div>

    <!-- Only shown on touch screens -->
    <div id="touch" aria-label="Touch controls">
      <button type="button" data-key="left" aria-label="Move left">&larr;</button>
      <button type="button" data-key="fire" class="fire" aria-label="Throw cash">Throw cash</button>
      <button type="button" data-key="right" aria-label="Move right">&rarr;</button>
    </div>
  </main>

  <noscript>Cashy Invaders needs JavaScript to run.</noscript>
  <!-- The leaderboard. Optional: the game runs the same without it. -->
  <script src="https://api.cashy.world/client.js" async></script>
  <script src="game.js"></script>
</body>
</html>
